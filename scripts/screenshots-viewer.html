<title>Pikku screenshot review</title>
<style>
  :root {
    --ink: #f3ece1;
    --ink-dim: #a9a096;
    --ground: #14110f;
    --panel: #1c1815;
    --edge: #302a25;
    --accent: #d98b4a;
    --accent-dim: #6b4526;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, serif;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    height: 100vh;
    display: grid;
    grid-template-columns: 300px 1fr 340px;
    overflow: hidden;
  }

  /* ---- sidebar ---- */
  aside {
    border-right: 1px solid var(--edge);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--edge);
  }
  .brand h1 {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 400;
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }
  .brand .meta { color: var(--ink-dim); font-size: 11px; }
  #filter {
    width: 100%;
    margin-top: 10px;
    padding: 6px 8px;
    background: var(--ground);
    border: 1px solid var(--edge);
    border-radius: 3px;
    color: var(--ink);
    font: inherit;
  }
  #filter:focus { outline: 1px solid var(--accent-dim); }
  nav { overflow-y: auto; flex: 1; min-height: 0; padding: 6px 0 40px; }
  nav button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 5px 16px;
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--ink-dim);
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl;
  }
  nav button > span { direction: ltr; unicode-bidi: bidi-override; }
  nav button:hover { color: var(--ink); background: #221d19; }
  nav button[aria-current='true'] {
    color: var(--ink);
    border-left-color: var(--accent);
    background: #241e19;
  }
  nav button .dot {
    color: var(--accent);
    direction: ltr;
    unicode-bidi: normal;
  }

  /* ---- stage ---- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--edge);
    background: var(--panel);
  }
  .bar .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar a { color: var(--accent); text-decoration: none; }
  .bar a:hover { text-decoration: underline; }
  .toggle { display: flex; border: 1px solid var(--edge); border-radius: 3px; overflow: hidden; }
  .toggle button {
    padding: 4px 10px;
    background: var(--ground);
    border: 0;
    color: var(--ink-dim);
    font: inherit;
    cursor: pointer;
  }
  .toggle button[aria-pressed='true'] { background: var(--accent-dim); color: var(--ink); }
  .stage { flex: 1; overflow: auto; padding: 20px; background: #0d0b0a; text-align: center; }
  .stage img {
    max-width: 100%;
    border: 1px solid var(--edge);
    background: #fff;
    box-shadow: 0 12px 40px rgb(0 0 0 / 0.5);
  }
  .stage img.mobile { max-width: 390px; }
  .stage .missing { color: var(--ink-dim); padding: 60px 0; font-style: italic; }

  /* ---- notes ---- */
  section.notes {
    border-left: 1px solid var(--edge);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .notes h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 14px;
    margin: 0;
    padding: 13px 16px;
    border-bottom: 1px solid var(--edge);
  }
  .notes .list { flex: 1; overflow-y: auto; padding: 10px 16px; }
  .notes .list p { color: var(--ink-dim); font-style: italic; }
  .note {
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 8px 10px;
    margin-bottom: 8px;
    background: var(--ground);
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }
  .note .when { display: block; color: var(--ink-dim); font-size: 10px; margin-bottom: 5px; }
  .note button {
    background: none;
    border: 0;
    color: var(--ink-dim);
    cursor: pointer;
    font: inherit;
    float: right;
  }
  .note button:hover { color: var(--accent); }
  .compose { border-top: 1px solid var(--edge); padding: 10px 16px 12px; }
  .compose textarea {
    width: 100%;
    height: 78px;
    resize: vertical;
    padding: 8px;
    background: var(--ground);
    border: 1px solid var(--edge);
    border-radius: 3px;
    color: var(--ink);
    font: inherit;
    line-height: 1.5;
  }
  .compose textarea:focus { outline: 1px solid var(--accent-dim); }
  .compose .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .compose .hint { color: var(--ink-dim); font-size: 10px; flex: 1; }
  button.primary {
    padding: 5px 12px;
    background: var(--accent);
    border: 0;
    border-radius: 3px;
    color: #17120d;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.ghost {
    padding: 5px 12px;
    background: none;
    border: 1px solid var(--edge);
    border-radius: 3px;
    color: var(--ink-dim);
    font: inherit;
    cursor: pointer;
  }
  button.ghost:hover { color: var(--ink); border-color: var(--accent-dim); }
  .export { display: flex; gap: 8px; padding: 0 16px 12px; }
  .export button { flex: 1; }
</style>

<aside>
  <div class="brand">
    <h1>Screenshot review</h1>
    <div class="meta"><span id="count"></span> · <span id="noted"></span> noted</div>
    <input id="filter" placeholder="filter paths…" />
  </div>
  <nav id="nav"></nav>
</aside>

<main>
  <div class="bar">
    <div class="path"><a id="live" target="_blank" rel="noreferrer"></a></div>
    <div class="toggle" id="viewport"></div>
  </div>
  <div class="stage" id="stage"></div>
</main>

<section class="notes">
  <h2>Notes on this page</h2>
  <div class="list" id="list"></div>
  <div class="compose">
    <textarea id="draft" placeholder="What's wrong with this screen?"></textarea>
    <div class="row">
      <span class="hint">⌘↵ to save · j/k to move</span>
      <button class="primary" id="save">Add note</button>
    </div>
  </div>
  <div class="export">
    <button class="ghost" id="download">Download JSON</button>
    <button class="ghost" id="copy">Copy all</button>
  </div>
</section>

<script>
  const MANIFEST = __MANIFEST__
  const STORE = 'pikku-screenshot-notes'

  // Notes live in localStorage so the page stays a single file with no server,
  // and the export buttons are how they get out to somewhere readable.
  let notes = {}
  try {
    notes = JSON.parse(localStorage.getItem(STORE) ?? '{}')
  } catch {}
  const persist = () => {
    try {
      localStorage.setItem(STORE, JSON.stringify(notes))
    } catch {}
  }

  let viewport = MANIFEST.viewports[0]
  let current = MANIFEST.pages[0]
  let filter = ''

  const el = (id) => document.getElementById(id)
  const visible = () => MANIFEST.pages.filter((p) => p.path.includes(filter))

  const renderNav = () => {
    const pages = visible()
    el('nav').replaceChildren(
      ...pages.map((page) => {
        const button = document.createElement('button')
        const n = (notes[page.path] ?? []).length
        // rtl truncation keeps the tail of a long path visible, which is the
        // half that tells you which page it is.
        button.innerHTML =
          (n ? '<span class="dot">● </span>' : '') + '<span></span>'
        button.querySelector('span:last-child').textContent = page.path
        button.setAttribute('aria-current', page === current)
        button.onclick = () => select(page)
        return button
      })
    )
    el('count').textContent = pages.length + ' pages'
    el('noted').textContent = Object.values(notes).filter((v) => v.length).length
  }

  const renderNotes = () => {
    const mine = notes[current.path] ?? []
    if (!mine.length) {
      el('list').innerHTML = '<p>No notes yet.</p>'
      return
    }
    el('list').replaceChildren(
      ...mine.map((note, index) => {
        const div = document.createElement('div')
        div.className = 'note'
        const remove = document.createElement('button')
        remove.textContent = '✕'
        remove.title = 'Delete'
        remove.onclick = () => {
          mine.splice(index, 1)
          if (!mine.length) delete notes[current.path]
          persist()
          renderNotes()
          renderNav()
        }
        const when = document.createElement('span')
        when.className = 'when'
        when.textContent = new Date(note.at).toLocaleString() + ' · ' + note.viewport
        div.append(remove, when, document.createTextNode(note.text))
        return div
      })
    )
  }

  const renderStage = () => {
    el('live').textContent = current.path
    el('live').href = MANIFEST.baseUrl + current.path
    const image = document.createElement('img')
    image.src = viewport + '/' + current.slug + '.jpg'
    image.className = viewport
    image.alt = current.path + ' at ' + viewport
    image.onerror = () => {
      el('stage').innerHTML =
        '<div class="missing">No ' + viewport + ' shot for ' + current.path + '</div>'
    }
    el('stage').replaceChildren(image)
    el('stage').scrollTop = 0
  }

  const select = (page) => {
    current = page
    renderNav()
    renderNotes()
    renderStage()
  }

  el('viewport').replaceChildren(
    ...MANIFEST.viewports.map((name) => {
      const button = document.createElement('button')
      button.textContent = name
      button.setAttribute('aria-pressed', name === viewport)
      button.onclick = () => {
        viewport = name
        for (const other of el('viewport').children)
          other.setAttribute('aria-pressed', other === button)
        renderStage()
      }
      return button
    })
  )

  const addNote = () => {
    const text = el('draft').value.trim()
    if (!text) return
    ;(notes[current.path] ??= []).push({ text, viewport, at: new Date().toISOString() })
    el('draft').value = ''
    persist()
    renderNotes()
    renderNav()
  }
  el('save').onclick = addNote
  el('draft').onkeydown = (event) => {
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) addNote()
  }

  const asJson = () =>
    JSON.stringify(
      {
        baseUrl: MANIFEST.baseUrl,
        exportedAt: new Date().toISOString(),
        notes: Object.entries(notes)
          .filter(([, v]) => v.length)
          .map(([path, entries]) => ({ path, notes: entries })),
      },
      null,
      2
    )

  el('download').onclick = () => {
    const url = URL.createObjectURL(new Blob([asJson()], { type: 'application/json' }))
    const link = document.createElement('a')
    link.href = url
    link.download = 'screenshot-notes.json'
    link.click()
    URL.revokeObjectURL(url)
  }
  el('copy').onclick = async () => {
    await navigator.clipboard.writeText(asJson())
    el('copy').textContent = 'Copied'
    setTimeout(() => (el('copy').textContent = 'Copy all'), 1200)
  }

  el('filter').oninput = (event) => {
    filter = event.target.value.trim()
    renderNav()
  }

  // j/k walks the filtered list, but not while you are typing a note.
  document.onkeydown = (event) => {
    if (event.target.matches('textarea, input')) return
    const pages = visible()
    const at = pages.indexOf(current)
    if (event.key === 'j' || event.key === 'ArrowDown') select(pages[Math.min(at + 1, pages.length - 1)])
    if (event.key === 'k' || event.key === 'ArrowUp') select(pages[Math.max(at - 1, 0)])
  }

  select(current)
</script>
